name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # Title/body-only edits neither cancel source checks nor need their own full gate.
  # Base-branch edits still use the source-check group because they change the merge input.
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && format('ci-edit-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs .

      - name: Install dependencies
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Install typos-cli
        run: cargo install typos-cli --locked --version 1.50.0

      - name: Typos
        run: typos

      - name: Install Vale
        env:
          VALE_SHA256: "c8f9d6c8055442bc7e9c121b2498e6f0e3fb670f4665e6ee577f1897f7665cf6"
          VALE_VERSION: "3.19.0"
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" vale
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Vale
        run: vale --no-global README.md src/content/blog

      - name: Prettier check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Unit tests
        run: npm test

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs .

      - name: Install dependencies
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --config lychee.toml --root-dir dist/client 'dist/client/**/*.html' README.md"
          fail: true

      - name: Deploy dry-run
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"

  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2

  codeql:
    name: CodeQL
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      languages: '["javascript-typescript"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""

  source:
    # Aggregates the source fan-out. Metadata-only edits skip it and `conclusion` mirrors the
    # latest completed `source` check for the same head commit instead.
    name: source
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    needs: [lint, build, zizmor, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Result
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          for RESULT in "${LINT_RESULT}" "${BUILD_RESULT}" "${ZIZMOR_RESULT}"; do
            if [[ "${RESULT}" != "success" ]]; then
              echo "::error::One or more source checks failed."
              exit 1
            fi
          done
          if [[ "${CODEQL_RESULT}" != "success" && ! ( "${GITHUB_EVENT_NAME}" == "push" && "${CODEQL_RESULT}" == "skipped" ) ]]; then
            echo "::error::The required CodeQL check did not succeed."
            exit 1
          fi

  conclusion:
    # GitHub evaluates required contexts against the newest check suite on the head commit, so
    # every run must emit `conclusion`, including a metadata-only edit that skips the fan-out.
    name: conclusion
    needs: [commits, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: always()
    permissions:
      checks: read # required to read the head commit's `source` check run on metadata-only edits
    steps:
      - name: Require the pull request title check
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
        run: |
          if [[ "${COMMITS_RESULT}" != "success" && ! ( "${GITHUB_EVENT_NAME}" == "push" && "${COMMITS_RESULT}" == "skipped" ) ]]; then
            echo "::error::The pull request title check failed."
            exit 1
          fi

      - name: Require this run's source gate
        if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != ''
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          if [[ "${SOURCE_RESULT}" != "success" ]]; then
            echo "::error::The source gate did not succeed: ${SOURCE_RESULT}."
            exit 1
          fi

      - name: Mirror the latest source gate for a metadata-only edit
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 50); do
            SOURCE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=source&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion != "skipped"
                  and (.details_url | contains("/runs/\(env.GITHUB_RUN_ID)/") | not))] | sort_by(.started_at) | last
                | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')"
            [[ "${SOURCE_STATE}" == "pending" ]] || break
            sleep 30
          done
          if [[ "${SOURCE_STATE}" != "success" ]]; then
            echo "::error::The source gate for ${HEAD_SHA} is ${SOURCE_STATE}; rerun the source workflow before merging."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: conclusion
    # `conclusion` needs `commits`, which is skipped on push; that skip would otherwise
    # propagate down the chain and skip this job even when the gate succeeded.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.conclusion.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs .

      - name: Install dependencies
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Build site
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Deploy reviewed revision to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Verify the public revision
        run: node scripts/verify-deployment.mjs https://starhaven.io/.well-known/revision.json "${GITHUB_SHA}"
