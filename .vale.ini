StylesPath = .vale/styles
MinAlertLevel = warning
SkippedScopes = blockquote
Vocab = Starhaven

[{README.md,src/content/blog/*.md}]
BasedOnStyles = Vale, write-good
Vale.Spelling = NO
Vale.Repetition = error
Vale.Terms = error
write-good.Cliches = error
write-good.Illusions = error
# Passive rejects constructions that are correct when the actor is irrelevant,
# and TooWordy rejects precise terms such as "aggregate".
write-good.Passive = NO
write-good.So = error
write-good.ThereIs = error
write-good.TooWordy = NO
write-good.Weasel = error
